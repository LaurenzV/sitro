workspace = { members = ["src/pdfium"] }
[package]
name = "sitro"
version = "0.2.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["hayro"]
hayro = ["dep:hayro"]

[dependencies]
image = {version = "0.24.7", features = ["png"]}
imagesize = "0.12.0"
rayon = "1.8.1"
regex = "1.10.2"
tempfile = "3"
tiny-skia = "0.11.4"
uuid = { version = "1", features = ["v4"] }
walkdir = "2.4.0"
hayro = { git = "https://github.com/LaurenzV/hayro.git", rev = "c9d699db74348be476b241563e4cabeb79935e90", features = ["embed-fonts"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
foreign-types = "0.5"
objc2 = "0.6"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGContext"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["PDFDocument", "PDFPage", "objc2-core-graphics"] }
